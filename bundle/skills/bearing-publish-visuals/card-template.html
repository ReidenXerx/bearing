  .sub { font-size: 30px; color: #b9b9c6; max-width: 1150px; }
  .visual { flex: 1; margin: 40px 0; border-radius: 16px; background: #222229; }
  .tiles { display: flex; gap: 28px; }
  .tile { flex: 1; padding: 22px 26px; border-radius: 14px; background: #1f1f26; }
  .tile b { display: block; font-size: 52px; color: var(--accent); }
  .tile span { font-size: 22px; color: #b9b9c6; }
  .source { margin-top: 22px; font: 18px ui-monospace, monospace; color: #7d7d8c; }

</style>
