# bearing — graph-backed impact report on every pull request.
#
# INFORMATIONAL. This workflow does not fail your build. It posts a report and gets out of the way.
# The reason is the graph's own contract: it resolves calls through factories and DI imperfectly, so
# `0 callers` can mean "none" or "could not resolve". A hard gate built on a signal that cannot tell
# those apart fails honest PRs, and people learn to route around it. A report a human reads is worth
# more than a gate they disable.
#
# Want teeth anyway? Set GITNEXUS_CI_MODE=block below — then a widely-called symbol changing with no
# test changes fails the check.
#
# The kit installs this for you; it is also fine to copy into another repo's .github/workflows/.
name: bearing impact report

on:
  pull_request:
    branches: [main, master]

# Least privilege: read the code, write the one sticky comment. Nothing else.
permissions:
  contents: read
  pull-requests: write

# A second push should replace the in-flight run, not queue behind it — the report is only ever
# about the current head.
concurrency:
  group: bearing-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so base...HEAD diff works

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Indexing dominates the runtime and the graph only changes when the code does.
      - name: Cache GitNexus index
        uses: actions/cache@v4
        with:
          path: .gitnexus
          key: gitnexus-${{ runner.os }}-${{ github.event.pull_request.base.sha }}
          restore-keys: gitnexus-${{ runner.os }}-

      - name: bearing impact report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITNEXUS_CI_MODE: report # `block` to fail on high-impact changes without tests
          GITNEXUS_CI_HIGH: "8"
          # Indexing a few-thousand-file repo on a 2-core runner can exceed 15m. If the cache is
          # cold and this still times out, the report says so and falls back to the diff.
          GITNEXUS_CI_INDEX_TIMEOUT_MS: "1500000"
        run: node scripts/bearing-ci.mjs "${{ github.base_ref }}"
