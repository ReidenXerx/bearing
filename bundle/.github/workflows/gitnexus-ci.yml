# bearing — graph-backed impact report on every pull request.
#
# INFORMATIONAL. This workflow does not fail your build, and it does not build the index either.
# It restores a warm one and reports in seconds.
#
# Why it never indexes: a first attempt built the graph inside this job, and on a 3,000-file repo
# that exceeded 25 minutes on a 2-core runner — every push, producing nothing. Worse, the killed
# run left a PARTIAL .gitnexus/ that actions/cache stored under the primary key, so every later run
# restored a useless index, rebuilt from scratch, timed out, and could not replace the entry it
# had poisoned. Indexing belongs on the default branch (see bearing-index-cache.yml), once per
# push, where a slow job is nobody's PR feedback loop.
#
# With no warm cache this still reports — from the diff alone — and says what is missing and why.
#
# Want teeth? Set GITNEXUS_CI_MODE=block: a widely-called symbol changing with no test changes then
# fails the check. Off by default, because the graph cannot distinguish "no callers" from "could
# not resolve callers", and a gate on that fails honest PRs until people route around it.
name: bearing impact report

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: bearing-impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact-report:
    runs-on: ubuntu-latest
    # A report that cannot finish in a couple of minutes is not a report anyone waits for.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so base...HEAD diff works

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # RESTORE ONLY — never save from a PR job. A cancelled or timed-out PR run must not be able
      # to overwrite the good index with a half-written one.
      - name: Restore GitNexus index
        uses: actions/cache/restore@v4
        with:
          path: .gitnexus
          key: bearing-index-${{ runner.os }}-
          restore-keys: bearing-index-${{ runner.os }}-

      - name: bearing impact report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITNEXUS_CI_MODE: report # `block` to fail on high-impact changes without tests
          GITNEXUS_CI_HIGH: "8"
          GITNEXUS_CI_SKIP_BUILD: "1" # indexing happens on the default branch, not here
        run: node scripts/bearing-ci.mjs "${{ github.base_ref }}"
