name: Feature request
description: A new module, hook, skill, or install UX improvement
title: "[feat]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent or team behavior are we trying to fix?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hooks / nudges
        - Install / verify UX
        - Skills / rule packs
        - GitNexus module (opt-in graph)
        - Docs / onboarding
        - Other
    validations:
      required: true
