name: Bug report
description: Something broke during install, update, a hook, or a skill
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Include versions and what you expected vs what happened.

  - type: input
    id: kit-version
    attributes:
      label: Kit version or commit
      placeholder: e.g. 1.3.0 or abc1234
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL
        - Other
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx bearing install ../my-repo --runtime claude
        2. Restart Claude Code
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / verify output
      description: Paste `npm run bearing:verify` (or `node scripts/bearing-verify.mjs`) or the install output
      render: shell
