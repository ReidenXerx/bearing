<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="bearing costs about 2,800 tokens a session by default — 1.4 percent of a 200k context window — and about 18,800 with every module plus the opt-in GitNexus tool schemas, 9.4 percent. When you ask for the graph, one impact question costs 3 to 13 times less than grepping and reading the hits.">
  <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#E0A458" stroke-opacity="0.35" stroke-width="2"/></pattern></defs>
  <style>
    .lab { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; letter-spacing: 1.4px; fill: #8DA0A7; }
    .h { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 700; fill: #E3EAE7; }
    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #E3EAE7; }
    .d { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #8DA0A7; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #E3EAE7; }
    .small { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #8DA0A7; }
  </style>
  <rect width="1200" height="450" rx="14" fill="#0A1013"/>
  <rect x="0.75" y="0.75" width="1198.5" height="448.5" rx="13.5" fill="none" stroke="#21303A" stroke-width="1.5"/>
<text x="36" y="44" class="lab">WHAT IT COSTS YOUR CONTEXT</text>
<text x="36" y="76" class="h">~2,800 tokens a session by default, measured</text>
<text x="36" y="120" class="lab">200K CONTEXT WINDOW</text>
<text x="1164" y="120" class="small" text-anchor="end">default ~2,800 · 1.4%   ·   everything + GitNexus ~18,800 · 9.4%</text>
