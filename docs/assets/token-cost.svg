<rect x="36" y="132" width="15.8" height="26" fill="#E0A458"/>
<text x="36" y="194" class="lab">1M CONTEXT WINDOW</text>
<text x="1164" y="194" class="small" text-anchor="end">default ~2,800 · 0.3%   ·   everything + GitNexus ~18,800 · 1.9%</text>
