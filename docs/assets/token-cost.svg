<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="bearing costs about 25,200 tokens per session — 13 percent of a 200k context window — and one blast-radius question costs 13 times less through the graph than through grep on a 709-file repo, 3 times less on a 234-file repo.">
<defs>
  <radialGradient id="tcSurface" cx="100%" cy="0%" r="120%">
    <stop offset="0%" stop-color="#161c27"/>
    <stop offset="55%" stop-color="#11161f"/>
  </radialGradient>
  <linearGradient id="tcPanel" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1d2533"/>
    <stop offset="100%" stop-color="#1a2130"/>
  </linearGradient>
  <filter id="tcShadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <style>
    .t  { font-family: ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif; }
    .hd { font-size: 11px; letter-spacing: 1.6px; fill: #61708a; font-weight: 700; }
    .big{ font-size: 38px; fill: #e8edf5; font-weight: 700; }
    .sub{ font-size: 12.5px; fill: #9aa8bd; }
    .lbl{ font-size: 12px; fill: #e8edf5; font-weight: 600; }
    .mut{ font-size: 11px; fill: #61708a; }
    .num{ font-size: 11.5px; fill: #9aa8bd; }
    .win{ font-size: 15px; fill: #199e70; font-weight: 700; }
  </style>
</defs>

<rect width="900" height="300" rx="14" fill="url(#tcSurface)"/>

<!-- ── left: what it costs ────────────────────────────────────────── -->
<rect x="26" y="26" width="392" height="248" rx="11" fill="url(#tcPanel)" stroke="#232c3b" filter="url(#tcShadow)"/>
<text x="50" y="59" class="t hd">WHAT IT COSTS</text>

<text x="50" y="112" class="t big">~25,200</text>
<text x="50" y="133" class="t sub">tokens, loaded every session</text>

<!-- stacked bar: 10,300 bearing / 14,900 graph schemas -->
<rect x="50" y="154" width="344" height="20" rx="5" fill="#141a24"/>
<rect x="50" y="154" width="141" height="20" rx="5" fill="#3987e5"/>
<rect x="187" y="154" width="207" height="20" rx="5" fill="#3a465c"/>

<circle cx="56" cy="199" r="4.5" fill="#3987e5"/>
<text x="68" y="203" class="t num">bearing's contract  ~10,300</text>
<circle cx="234" cy="199" r="4.5" fill="#3a465c"/>
<text x="246" y="203" class="t num">graph tool schemas  ~14,900</text>

<rect x="50" y="222" width="344" height="1" fill="#232c3b"/>
<text x="50" y="245" class="t sub">13% of a 200k window  ·  2.5% of 1M</text>
<text x="50" y="263" class="t mut">intel-only, without the graph: ~2,400</text>

<!-- ── right: what it saves ───────────────────────────────────────── -->
<rect x="440" y="26" width="434" height="248" rx="11" fill="url(#tcPanel)" stroke="#232c3b" filter="url(#tcShadow)"/>
<text x="464" y="59" class="t hd">WHAT IT SAVES</text>
<text x="464" y="80" class="t sub">one “what breaks if I change this?”</text>

<!-- row 1 — bar widths are the measured token ratios, not decoration -->
<text x="464" y="112" class="t lbl">Sourcerer-Be</text>
<text x="551" y="112" class="t mut">894 files</text>
<rect x="464" y="120" width="270" height="14" rx="4" fill="#d95926" opacity="0.85"/>
<rect x="464" y="138" width="20" height="14" rx="4" fill="#3987e5"/>
<text x="852" y="132" text-anchor="end" class="t win">13.2×</text>
<text x="852" y="148" text-anchor="end" class="t mut">cheaper</text>

<!-- row 2 -->
<text x="464" y="190" class="t lbl">lead-sniffer</text>
<text x="546" y="190" class="t mut">374 files</text>
<rect x="464" y="198" width="270" height="14" rx="4" fill="#d95926" opacity="0.85"/>
<rect x="464" y="216" width="89" height="14" rx="4" fill="#3987e5"/>
<text x="852" y="210" text-anchor="end" class="t win">3.0×</text>
<text x="852" y="226" text-anchor="end" class="t mut">cheaper</text>

<circle cx="470" cy="253" r="4.5" fill="#d95926"/>
<text x="482" y="257" class="t num">git grep + read the hits</text>
<circle cx="640" cy="253" r="4.5" fill="#3987e5"/>
<text x="652" y="257" class="t num">graph, every call site</text>
</svg>
