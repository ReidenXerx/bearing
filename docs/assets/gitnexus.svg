<svg height="244" viewBox="0 0 900 244" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><radialGradient id="a" cx="100%" cy="0%" r="120%"><stop offset="0" stop-color="#161c27"/><stop offset=".55" stop-color="#11161f"/></radialGradient><linearGradient id="b" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d2533"/><stop offset="1" stop-color="#1a2130"/></linearGradient><filter id="c" height="140%" width="140%" x="-20%" y="-20%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="6" result="off"/><feComponentTransfer><feFuncA slope="0.55" type="linear"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><rect fill="url(#a)" height="244" rx="14" stroke="#232c3b" width="900"/><g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif"><text fill="#61708a" font-size="11.5" font-weight="600" letter-spacing="1.6" x="28" y="34">YOU ASK: WHO USES ORDERSERVICE?</text><text fill="#e8edf5" font-size="21" font-weight="700" x="28" y="60">40 text matches, or the actual callers.</text><text fill="#d95926" font-size="12.5" x="28" y="96">GREP</text></g><rect fill="url(#b)" filter="url(#c)" height="60" rx="10" stroke="#2c3648" width="380" x="28" y="104"/><path d="m29 115a10 10 0 0 1 10-10h2v58h-2a10 10 0 0 1 -10-10z" fill="#d95926"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="48" y="130">40 matches. No structure.</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="48" y="149">strings, comments, its own definition</text><text fill="#3987e5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="492" y="96">GRAPH</text><rect fill="url(#b)" filter="url(#c)" height="60" rx="10" stroke="#2c3648" width="380" x="492" y="104"/><path d="m493 115a10 10 0 0 1 10-10h2v58h-2a10 10 0 0 1 -10-10z" fill="#3987e5"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="512" y="130">3 callers, 2 flows, 1 route</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="512" y="149">what actually calls what</text><text fill="#61708a" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" text-anchor="middle" x="450" y="141">vs</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="200">A zero is not a finding: the graph is authoritative about what it FINDS, never about what it misses.</text><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="222">Unresolvable callers are flagged, distrust is logged as a bug report you can send upstream.</text></svg>