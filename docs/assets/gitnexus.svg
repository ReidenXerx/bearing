<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 244" width="900" height="244" role="img" aria-label="A grep returns 40 unstructured text matches; the graph returns the actual callers and flows — and a zero result is treated as unknown, not as absence.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
</defs>
<rect width="900" height="244" rx="14" fill="#11161f" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">YOU ASK: WHO USES ORDERSERVICE?</text>
<text x="28" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="19" font-weight="650" fill="#e8edf5">40 text matches, or the actual callers.</text>
<text x="28" y="96" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#d95926">GREP</text>
<rect x="28" y="104" width="380" height="60" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M29 115 a10 10 0 0 1 10 -10 h2 v58 h-2 a10 10 0 0 1 -10 -10 z" fill="#d95926"/>
<text x="48" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">40 matches. No structure.</text>
<text x="48" y="149" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">strings, comments, its own definition</text>
<text x="492" y="96" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#3987e5">GRAPH</text>
<rect x="492" y="104" width="380" height="60" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M493 115 a10 10 0 0 1 10 -10 h2 v58 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="512" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">3 callers, 2 flows, 1 route</text>
<text x="512" y="149" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">what actually calls what</text>
<text x="450" y="141" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#61708a">vs</text>
<text x="28" y="200" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">A zero is not a finding: the graph is authoritative about what it FINDS, never about what it misses.</text>
<text x="28" y="222" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#61708a">Unresolvable callers are flagged, distrust is logged as a bug report you can send upstream.</text>
</svg>
