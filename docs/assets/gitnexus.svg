<text x="602" y="305" class="small" text-anchor="start" style="fill:#E0A458">A positive result is strong evidence. A zero is not a finding.</text>
<text x="36" y="362" class="d" text-anchor="start">Two gates: a stale index blocks until it is refreshed, and so does working-tree drift — the graph would otherwise answer about code you already changed.</text>
