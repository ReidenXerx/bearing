<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 432" width="1200" height="432" role="img" aria-label="Docs, comments and the agent's own guess are outranked by the numbered north-star, which is written as a claim a conclusion could violate.">
  <style>
