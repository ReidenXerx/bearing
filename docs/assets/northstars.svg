<svg height="256" viewBox="0 0 900 256" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><marker id="a" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" fill="#3a465c"/></marker><radialGradient id="b" cx="100%" cy="0%" r="120%"><stop offset="0" stop-color="#161c27"/><stop offset=".55" stop-color="#11161f"/></radialGradient><linearGradient id="c" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d2533"/><stop offset="1" stop-color="#1a2130"/></linearGradient><filter id="d" height="140%" width="140%" x="-20%" y="-20%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="6" result="off"/><feComponentTransfer><feFuncA slope="0.55" type="linear"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><rect fill="url(#b)" height="256" rx="14" stroke="#232c3b" width="900"/><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" x="28" y="34">FOUR SOURCES, ONE ANSWER</text><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" x="28" y="60">Something has to outrank the rest.</text><rect fill="url(#c)" filter="url(#d)" height="32" rx="10" stroke="#2c3648" width="232" x="28" y="88"/><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="44" y="109">A doc from March</text><rect fill="url(#c)" filter="url(#d)" height="32" rx="10" stroke="#2c3648" width="232" x="28" y="126"/><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="44" y="147">The README</text><rect fill="url(#c)" filter="url(#d)" height="32" rx="10" stroke="#2c3648" width="232" x="28" y="164"/><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="44" y="185">A code comment</text><rect fill="url(#c)" filter="url(#d)" height="32" rx="10" stroke="#2c3648" width="232" x="28" y="202"/><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="44" y="223">The agent's own guess</text><g fill="none" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"><path d="m260 104h56v54h56"/><path d="m260 142h56v16h56"/><path d="m260 180h56v-22h56"/><path d="m260 218h56v-60h56"/></g><rect fill="url(#c)" filter="url(#d)" height="52" rx="10" stroke="#2c3648" width="214" x="372" y="132"/><path d="m373 143a10 10 0 0 1 10-10h2v50h-2a10 10 0 0 1 -10-10z" fill="#d95926"/><text fill="#e8edf5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" x="392" y="154">CONFLICT</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="392" y="173">which one is true?</text><path d="m586 158h44" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><rect fill="url(#c)" filter="url(#d)" height="76" rx="10" stroke="#2c3648" width="242" x="630" y="120"/><path d="m631 131a10 10 0 0 1 10-10h2v74h-2a10 10 0 0 1 -10-10z" fill="#3987e5"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="650" y="154">NS-4 wins</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="650" y="173">the others are stale</text><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="232">The agent must CITE it for any load-bearing claim — and may never edit it silently.</text></svg>