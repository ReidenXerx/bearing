    .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; fill: #E3EAE7; }
    .d { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 14px; fill: #8DA0A7; }
    .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #E3EAE7; }
    .monod { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #8DA0A7; }
    .small { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 11.5px; fill: #8DA0A7; }
  </style>
  <rect width="1200" height="432" rx="14" fill="#0A1013"/>
  <rect x="0.75" y="0.75" width="1198.5" height="430.5" rx="13.5" fill="none" stroke="#21303A" stroke-width="1.5"/>
<text x="36" y="44" class="lab" text-anchor="start">NORTH-STARS</text>
<text x="36" y="76" class="h" text-anchor="start">Falsifiable, or it's decoration</text>
<text x="36" y="124" class="lab" text-anchor="start">WHAT THE AGENT WOULD OTHERWISE BELIEVE</text>
<rect x="36" y="150" width="430" height="44" rx="10" fill="#0D161A" stroke="#21303A" stroke-width="1.5"/>
<text x="56" y="177" class="mono" text-anchor="start" style="fill:#8DA0A7">README.md</text>
<text x="446" y="177" class="small" text-anchor="end">written before the rewrite</text>
<line x1="56" y1="172" x2="126" y2="172" stroke="#E8877A" stroke-width="1.2" opacity=".7"/>
<rect x="36" y="204" width="430" height="44" rx="10" fill="#0D161A" stroke="#21303A" stroke-width="1.5"/>
<text x="56" y="231" class="mono" text-anchor="start" style="fill:#8DA0A7">design-doc-march.md</text>
<text x="446" y="231" class="small" text-anchor="end">abandoned</text>
<line x1="56" y1="226" x2="204" y2="226" stroke="#E8877A" stroke-width="1.2" opacity=".7"/>
<rect x="36" y="258" width="430" height="44" rx="10" fill="#0D161A" stroke="#21303A" stroke-width="1.5"/>
<text x="56" y="285" class="mono" text-anchor="start" style="fill:#8DA0A7">// comment</text>
<text x="446" y="285" class="small" text-anchor="end">describes the old shape</text>
<line x1="56" y1="280" x2="134" y2="280" stroke="#E8877A" stroke-width="1.2" opacity=".7"/>
<rect x="36" y="312" width="430" height="44" rx="10" fill="#0D161A" stroke="#21303A" stroke-width="1.5"/>
<text x="56" y="339" class="mono" text-anchor="start" style="fill:#8DA0A7">the agent's own guess</text>
<text x="446" y="339" class="small" text-anchor="end">confident, unsourced</text>
<line x1="56" y1="334" x2="220" y2="334" stroke="#E8877A" stroke-width="1.2" opacity=".7"/>
<path d="M492 268 L560 268" stroke="#E0A458" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#E0A458"/></marker></defs>
<text x="526" y="256" class="small" text-anchor="middle" style="fill:#E0A458">OUTRANKS</text>
<rect x="586" y="124" width="578" height="216" rx="10" fill="#111A1F" stroke="#E0A458" stroke-width="1.5"/>
<text x="610" y="152" class="small" text-anchor="start">.bearing/north-stars.md</text>
<text x="610" y="184" class="mono" text-anchor="start" style="fill:#E0A458">- NS-4 —</text>
<text x="684" y="184" class="mono" text-anchor="start">Win-rate is NEVER a ranker. Only net</text>
<text x="684" y="206" class="mono" text-anchor="start">expectancy is a profitability claim.</text>
<text x="610" y="250" class="mono" text-anchor="start" style="fill:#E0A458">- NS-9 —</text>
<text x="684" y="250" class="mono" text-anchor="start">REJECTED: averaging into a losing</text>
<text x="684" y="272" class="mono" text-anchor="start">position. Measured: adds fill only on</text>
<text x="684" y="294" class="mono" text-anchor="start">the weaker cases. Don't re-propose.</text>
<text x="36" y="408" class="d" text-anchor="start">Write them as claims a conclusion could violate. "Be careful with risk" can't be violated, so it can't catch anything.</text>
</svg>
