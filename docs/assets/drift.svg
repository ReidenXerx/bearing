d="m224 123h38v-7h38" fill="none" marker-end="url(#a)" stroke="#d95926" stroke-width="1.75"/><path d="m224 123h38v95h38" fill="none" marker-end="url(#a)" stroke="#3987e5" stroke-width="1.75"/><text fill="#d95926" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="300" y="100">WITHOUT</text><rect fill="url(#c)" filter="url(#d)" height="54" rx="10" stroke="#2c3648" width="258" x="300" y="108"/><path d="m301 119a10 10 0 0 1 10-10h2v52h-2a10 10 0 0 1 -10-10z" fill="#d95926"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="320" y="131">Every later conclusion</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="320" y="150">inherits it, silently</text><path d="m558 135h48" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><rect fill="url(#c)" filter="url(#d)" height="54" rx="10" stroke="#2c3648" width="266" x="606" y="108"/><path d="m607 119a10 10 0 0 1 10-10h2v52h-2a10 10 0 0 1 -10-10z" fill="#d95926"/><g font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif"><text fill="#f2a58a" font-size="15" font-weight="600" x="626" y="131">Found out 3 days later</text><text fill="#9aa8bd" font-size="12.5" x="626" y="150">after you shipped on it</text><text fill="#3987e5" font-size="12.5" x="300" y="202">WITH BEARING</text></g><rect fill="url(#c)" filter="url(#d)" height="54" rx="10" stroke="#2c3648" width="258" x="300" y="210"/><path d="m301 221a10 10 0 0 1 10-10h2v52h-2a10 10 0 0 1 -10-10z" fill="#3987e5"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="320" y="233">Contradicts NS-4</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="320" y="252">the north-star outranks it</text><path d="m558 237h48" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><rect fill="url(#c)" filter="url(#d)" height="54" rx="10" stroke="#2c3648" width="266" x="606" y="210"/><path d="m607 221a10 10 0 0 1 10-10h2v52h-2a10 10 0 0 1 -10-10z" fill="#199e70"/><text fill="#7fd9b4" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="626" y="233">Caught in one line</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="626" y="252">before the premise spreads</text></svg>