<line x1="82" y1="150" x2="376" y2="218" stroke="#d95926" stroke-width="1.5" opacity="0.55"/>
<line x1="82" y1="150" x2="376" y2="252" stroke="#d95926" stroke-width="1.5" opacity="0.55"/>
<circle cx="384" cy="116" r="7" fill="#d95926" opacity="0.7"/>
<circle cx="384" cy="150" r="7" fill="#d95926" opacity="0.7"/>
<circle cx="384" cy="184" r="7" fill="#d95926" opacity="0.7"/>
<circle cx="384" cy="218" r="7" fill="#d95926" opacity="0.7"/>
<circle cx="384" cy="252" r="7" fill="#d95926" opacity="0.7"/>
<text x="392" y="100" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#9aa8bd">every later conclusion inherits it</text>
<line x1="450" y1="100" x2="450" y2="200" stroke="#232c3b" stroke-width="1.5" stroke-dasharray="2 5"/>
