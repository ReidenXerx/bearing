<text x="520" y="182" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#61708a">stale doc</text>
<rect x="618" y="106" width="12" height="156" rx="6" fill="#3987e5" opacity="0.22"/>
<rect x="620" y="106" width="8" height="156" rx="4" fill="#3987e5"/>
<text x="624" y="98" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#3987e5">NS</text>
