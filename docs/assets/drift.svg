<svg height="300" viewBox="0 0 900 300" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><radialGradient id="a" cx="100%" cy="0%" r="120%"><stop offset="0" stop-color="#161c27"/><stop offset=".55" stop-color="#11161f"/></radialGradient><rect fill="url(#a)" height="300" rx="14" stroke="#232c3b" width="900"/><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" x="28" y="34">A STALE PREMISE SPREADS TO EVERY LATER CONCLUSION</text><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" x="28" y="62">It spreads — until a north-star stops it.</text><g fill="#d95926"><text font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="104">WITHOUT</text><circle cx="70" cy="150" r="12" visibility="hidden"/><text font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="70" y="182">stale doc</text><circle cx="388" cy="116" opacity=".7" r="7"/><circle cx="388" cy="150" opacity=".7" r="7"/><circle cx="388" cy="184" opacity=".7" r="7"/><circle cx="388" cy="218" opacity=".7" r="7"/><circle cx="388" cy="252" opacity=".7" r="7"/></g><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="400" y="96">every later conclusion inherits it</text><path d="m450 100v100" stroke="#232c3b" stroke-dasharray="2 5" stroke-width="1.5"/><text fill="#3987e5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="478" y="104">WITH BEARING</text><circle cx="520" cy="150" fill="#d95926" r="12" visibility="hidden"/><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="520" y="182">stale doc</text><rect fill="#3987e5" height="84" rx="4" visibility="hidden" width="8" x="620" y="110"/><text fill="#3987e5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" x="638" y="152">NS</text><circle cx="800" cy="116" fill="#199e70" opacity=".35" r="7"/><circle cx="800" cy="150" fill="#199e70" opacity=".35" r="7"/><circle cx="800" cy="184" fill="#199e70" opacity=".35" r="7"/><circle cx="800" cy="218" fill="#199e70" opacity=".35" r="7"/><circle cx="800" cy="252" fill="#199e70" opacity=".35" r="7"/><text fill="#3987e5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="648" y="222">the gate outranks it — spread stops</text><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="276">A drifted agent doesn't crash. You find out three days later — unless a north-star caught it first.</text></svg>