="49.3" stroke="#8DA0A7" stroke-width="1" opacity="0.5"/><line x1="1102.0" y1="41.0" x2="1105.5" y2="43.0" stroke="#8DA0A7" stroke-width="1" opacity="0.5"/><line x1="1106.8" y1="34.8" x2="1109.6" y2="37.6" stroke="#8DA0A7" stroke-width="1" opacity="0.5"/><line x1="1113.0" y1="30.0" x2="1115.0" y2="33.5" stroke="#8DA0A7" stroke-width="1" opacity="0.5"/><line x1="1120.2" y1="27.0" x2="1121.3" y2="30.9" stroke="#8DA0A7" stroke-width="1" opacity="0.5"/><g transform="rotate(18 1128 56)"><path d="M1128 38 L1133 56 L1128 60 L1123 56 Z" fill="#E0A458"/><path d="M1128 74 L1123 56 L1128 52 L1133 56 Z" fill="#8DA0A7" opacity=".55"/></g><circle cx="1128" cy="56" r="3.4" fill="#0A1013" stroke="#E3EAE7" stroke-width="1.4"/>
<rect x="36" y="112" width="546" height="286" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="60" y="142" class="lab" text-anchor="start" style="fill:#E8877A">WITHOUT</text>
<circle cx="68" cy="171" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="68" y="175" class="small" text-anchor="middle" style="fill:#8DA0A7">1</text>
<line x1="68" y1="183" x2="68" y2="220" stroke="#21303A" stroke-width="1.2"/>
<text x="90" y="168" class="small" text-anchor="start" style="fill:#8DA0A7">MARCH</text>
<text x="90" y="187" class="d" text-anchor="start">A design doc is written, then abandoned.</text>
<circle cx="68" cy="227" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="68" y="231" class="small" text-anchor="middle" style="fill:#8DA0A7">2</text>
<line x1="68" y1="239" x2="68" y2="276" stroke="#21303A" stroke-width="1.2"/>
<text x="90" y="224" class="small" text-anchor="start" style="fill:#8DA0A7">TODAY, 14:02</text>
<text x="90" y="243" class="d" text-anchor="start">The agent reads it and re-proposes the feature you measured and killed.</text>
<circle cx="68" cy="283" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="68" y="287" class="small" text-anchor="middle" style="fill:#8DA0A7">3</text>
<line x1="68" y1="295" x2="68" y2="332" stroke="#21303A" stroke-width="1.2"/>
<text x="90" y="280" class="small" text-anchor="start" style="fill:#8DA0A7">TODAY, 14:03</text>
<text x="90" y="299" class="d" text-anchor="start">It writes a convincing paragraph. You nod.</text>
<circle cx="68" cy="339" r="10" fill="#0D161A" stroke="#E8877A" stroke-width="1.4"/>
<text x="68" y="343" class="small" text-anchor="middle" style="fill:#E8877A">4</text>
<text x="90" y="336" class="small" text-anchor="start" style="fill:#E8877A">THREE DAYS LATER</text>
<text x="90" y="355" class="t" text-anchor="start" style="fill:#E8877A">You find out.</text>
<rect x="618" y="112" width="546" height="286" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="642" y="142" class="lab" text-anchor="start" style="fill:#4FC2AE">WITH BEARING</text>
<circle cx="650" cy="171" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="650" y="175" class="small" text-anchor="middle" style="fill:#8DA0A7">1</text>
<line x1="650" y1="183" x2="650" y2="220" stroke="#21303A" stroke-width="1.2"/>
<text x="672" y="168" class="small" text-anchor="start" style="fill:#8DA0A7">ONCE</text>
<text x="672" y="187" class="d" text-anchor="start">You write NS-9: the claim that the idea was measured and rejected.</text>
<circle cx="650" cy="227" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="650" y="231" class="small" text-anchor="middle" style="fill:#8DA0A7">2</text>
<line x1="650" y1="239" x2="650" y2="276" stroke="#21303A" stroke-width="1.2"/>
<text x="672" y="224" class="small" text-anchor="start" style="fill:#8DA0A7">TODAY, 14:02</text>
<text x="672" y="243" class="d" text-anchor="start">The agent forms the same intent.</text>
<circle cx="650" cy="283" r="10" fill="#0D161A" stroke="#8DA0A7" stroke-width="1.4"/>
<text x="650" y="287" class="small" text-anchor="middle" style="fill:#8DA0A7">3</text>
<line x1="650" y1="295" x2="650" y2="332" stroke="#21303A" stroke-width="1.2"/>
<text x="672" y="280" class="small" text-anchor="start" style="fill:#8DA0A7">TODAY, 14:02</text>
<text x="672" y="299" class="d" text-anchor="start">The north-star outranks the abandoned doc.</text>
<circle cx="650" cy="339" r="10" fill="#0D161A" stroke="#4FC2AE" stroke-width="1.4"/>
<text x="650" y="343" class="small" text-anchor="middle" style="fill:#4FC2AE">4</text>
<text x="672" y="336" class="small" text-anchor="start" style="fill:#4FC2AE">ONE LINE LATER</text>
<text x="672" y="355" class="t" text-anchor="start" style="fill:#4FC2AE">Caught, cited, and not re-proposed.</text>
<text x="36" y="414" class="d" text-anchor="start">Nothing is red. The build passes, the tests pass, the paragraph is convincing — what changed is what the agent believes the code means.</text>
</svg>
