<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 268" width="900" height="268" role="img" aria-label="Without bearing a stale premise is found three days later; with it the north-star outranks the doc and it is caught in one line.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
</defs>
<rect width="900" height="268" rx="14" fill="#11161f" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">AN AGENT READS A DOC YOU ABANDONED IN MARCH</text>
<text x="28" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="19" font-weight="650" fill="#e8edf5">The premise is dead. Nothing fails.</text>
<rect x="28" y="92" width="196" height="62" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M29 103 a10 10 0 0 1 10 -10 h2 v60 h-2 a10 10 0 0 1 -10 -10 z" fill="#61708a"/>
<text x="48" y="119" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Stale doc</text>
<text x="48" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">confident. fluent.</text>
<path d="M224 123 H262 V116 H300" fill="none" stroke="#d95926" stroke-width="1.75" marker-end="url(#ar)"/>
<path d="M224 123 H262 V218 H300" fill="none" stroke="#3987e5" stroke-width="1.75" marker-end="url(#ar)"/>
<text x="300" y="100" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#d95926">WITHOUT</text>
<rect x="300" y="108" width="258" height="54" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M301 119 a10 10 0 0 1 10 -10 h2 v52 h-2 a10 10 0 0 1 -10 -10 z" fill="#d95926"/>
<text x="320" y="131" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Every later conclusion</text>
<text x="320" y="150" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">inherits it, silently</text>
<line x1="558" y1="135" x2="606" y2="135" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<rect x="606" y="108" width="266" height="54" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M607 119 a10 10 0 0 1 10 -10 h2 v52 h-2 a10 10 0 0 1 -10 -10 z" fill="#d95926"/>
<text x="626" y="131" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#f2a58a">Found out 3 days later</text>
<text x="626" y="150" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">after you shipped on it</text>
<text x="300" y="202" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#3987e5">WITH BEARING</text>
<rect x="300" y="210" width="258" height="54" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M301 221 a10 10 0 0 1 10 -10 h2 v52 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="320" y="233" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Contradicts NS-4</text>
<text x="320" y="252" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">the north-star outranks it</text>
<line x1="558" y1="237" x2="606" y2="237" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<rect x="606" y="210" width="266" height="54" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M607 221 a10 10 0 0 1 10 -10 h2 v52 h-2 a10 10 0 0 1 -10 -10 z" fill="#199e70"/>
<text x="626" y="233" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#7fd9b4">Caught in one line</text>
<text x="626" y="252" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">before the premise spreads</text>
</svg>
