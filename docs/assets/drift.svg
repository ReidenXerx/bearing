<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" role="img" aria-label="Without bearing a killed idea comes back and is found three days later; with it the north-star outranks the abandoned doc and it is caught in one line.">
