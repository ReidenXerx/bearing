<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Without bearing a stale premise spreads silently to every later conclusion; with it a north-star gate stops the spread at the source.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
  <radialGradient id="surfaceGrad" cx="100%" cy="0%" r="120%">
    <stop offset="0%" stop-color="#161c27"/>
    <stop offset="55%" stop-color="#11161f"/>
  </radialGradient>
  <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1d2533"/>
    <stop offset="100%" stop-color="#1a2130"/>
  </linearGradient>
</defs>
<rect width="900" height="300" rx="14" fill="url(#surfaceGrad)" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">A STALE PREMISE SPREADS TO EVERY LATER CONCLUSION</text>
<text x="28" y="62" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#e8edf5">It spreads — until a north-star stops it.</text>
<text x="28" y="104" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#d95926">WITHOUT</text>
<circle cx="70" cy="150" r="26.400000000000002" fill="#d95926" opacity="0.22"/><circle cx="70" cy="150" r="12" fill="#d95926" opacity="1"/>
<text x="70" y="182" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#d95926">stale doc</text>
<line x1="82" y1="150" x2="376" y2="116" stroke="#d95926" stroke-width="1.5" opacity="0.55"/>
