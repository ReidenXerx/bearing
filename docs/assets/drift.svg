  <rect x="0.75" y="0.75" width="1198.5" height="428.5" rx="13.5" fill="none" stroke="#21303A" stroke-width="1.5"/>
<text x="36" y="44" class="lab" text-anchor="start">THE FAILURE THIS EXISTS FOR</text>
<text x="36" y="76" class="h" text-anchor="start">A drifted agent doesn't crash</text>
