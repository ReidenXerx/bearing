<line x1="532" y1="150" x2="616" y2="218" stroke="#d95926" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4"/>
<line x1="532" y1="150" x2="616" y2="252" stroke="#d95926" stroke-width="1.5" opacity="0.5" stroke-dasharray="4 4"/>

<line x1="632" y1="116" x2="793" y2="116" stroke="#199e70" stroke-width="1.5" opacity="0.45"/>
<line x1="632" y1="150" x2="793" y2="150" stroke="#199e70" stroke-width="1.5" opacity="0.45"/>
<line x1="632" y1="184" x2="793" y2="184" stroke="#199e70" stroke-width="1.5" opacity="0.45"/>
<line x1="632" y1="218" x2="793" y2="218" stroke="#199e70" stroke-width="1.5" opacity="0.45"/>
<line x1="632" y1="252" x2="793" y2="252" stroke="#199e70" stroke-width="1.5" opacity="0.45"/>
<circle cx="800" cy="116" r="7" fill="#199e70" opacity="0.35"/>
<circle cx="800" cy="150" r="7" fill="#199e70" opacity="0.35"/>
<circle cx="800" cy="184" r="7" fill="#199e70" opacity="0.35"/>
<circle cx="800" cy="218" r="7" fill="#199e70" opacity="0.35"/>
<circle cx="800" cy="252" r="7" fill="#199e70" opacity="0.35"/>
<text x="872" y="100" text-anchor="end" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#3987e5">the gate outranks it</text>
<text x="28" y="276" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#61708a">A drifted agent doesn't crash. You find out three days later — unless a north-star caught it first.</text>
