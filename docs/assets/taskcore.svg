<text x="48" y="112" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9aa8bd" opacity="0.32">user: let's fix the fee calc so it handles net...</text>
<text x="48" y="132" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9aa8bd" opacity="0.28">agent: I'll change RATE to net-gated... tried gross*RATE, that</text>
<text x="48" y="152" text-anchor="start" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" fill="#9aa8bd" opacity="0.24">broke the ledger test. gotcha: don't touch the RATE const, gate</text>
