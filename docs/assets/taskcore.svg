<rect width="900" height="300" rx="14" fill="url(#surfaceGrad)" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">LONG SESSION · COMPACTION INCOMING</text>
<text x="28" y="62" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#e8edf5">What compaction erases, the task-core already saved.</text>
