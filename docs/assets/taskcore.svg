<path d="M487 129 a10 10 0 0 1 10 -10 h2 v60 h-2 a10 10 0 0 1 -10 -10 z" fill="#d95926"/>
<text x="506" y="145" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#e8edf5">COMPACTION</text>
