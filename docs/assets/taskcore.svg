<path d="M29 129 a10 10 0 0 1 10 -10 h2 v60 h-2 a10 10 0 0 1 -10 -10 z" fill="#61708a"/>
<text x="48" y="145" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">~90% full</text>
<text x="48" y="164" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">pressure detected</text>
<rect x="232" y="108" width="226" height="82" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M233 119 a10 10 0 0 1 10 -10 h2 v80 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="252" y="145" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">TASK-CORE written</text>
<text x="252" y="164" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">goal · decisions · gotchas</text>
<text x="232" y="206" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#3987e5">before the summary, not after</text>
