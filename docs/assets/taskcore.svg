<text x="56" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#3987e5">TASK-CORE</text>
<text x="56" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="500" fill="#e8edf5">GOAL · CONSTRAINTS · DECISIONS(+why) · STATE · ANCHORS(file:line) · GOTCHAS</text>
<rect x="740" y="229" width="97.4" height="26" rx="13" fill="#000" opacity="0.3"/>
