<rect x="682" y="108" width="190" height="82" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M683 119 a10 10 0 0 1 10 -10 h2 v80 h-2 a10 10 0 0 1 -10 -10 z" fill="#199e70"/>
<text x="702" y="145" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Read back</text>
<text x="702" y="164" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">goal intact</text>
<line x1="204" y1="150" x2="232" y2="150" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
