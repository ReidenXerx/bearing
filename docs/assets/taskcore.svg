    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
</defs>
<rect width="900" height="238" rx="14" fill="#11161f" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">LONG SESSION · CONTEXT FILLING</text>
<text x="28" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="19" font-weight="650" fill="#e8edf5">The detail is written down before it's lost.</text>
