<path d="M181 265 a10 10 0 0 1 10 -10 h2 v56 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="200" y="279" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">YOU conclude</text>
<text x="200" y="298" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">from citations you can open and check yourself</text>
<text x="28" y="334" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">Minions do minimal or zero reasoning: a subagent that CONCLUDES puts a lossy summary between the evidence and your decision.</text>
</svg>
