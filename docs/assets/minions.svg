<text x="48" y="129" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">40 reads, one after another</text>
<text x="48" y="148" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">your window, your tokens, your afternoon</text>
<text x="450" y="139" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#61708a">vs</text>
<text x="500" y="96" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#3987e5">FAN-OUT</text>
<rect x="510" y="96" width="372" height="58" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.4"/>
<rect x="505" y="100" width="372" height="58" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.7"/>
<rect x="500" y="104" width="372" height="58" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M501 115 a10 10 0 0 1 10 -10 h2 v56 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="520" y="129" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">40 minions, middle tier</text>
<text x="520" y="148" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">each carries your north-stars + persona</text>
