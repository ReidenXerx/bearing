<g><rect x="28" y="198" width="323.8" height="26" rx="13" fill="#199e70"/><text x="189.9" y="215.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">FOUND  src/fees.ts:88 — fee = gross * RATE</text></g>
<g><rect x="368" y="198" width="198" height="26" rx="13" fill="#61708a"/><text x="467" y="215.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">CHECKED  rg "* RATE" src/</text></g>
<g><rect x="576" y="198" width="190.60000000000002" height="26" rx="13" fill="#d95926"/><text x="671.3" y="215.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">MISSED  dynamic dispatch</text></g>
<line x1="450" y1="224" x2="450" y2="252" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
