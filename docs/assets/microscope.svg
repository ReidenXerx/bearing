<g><rect x="616" y="250" width="227.60000000000002" height="26" rx="13" fill="#d95926"/><text x="729.8" y="267.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✕  refuted → you never see it</text></g>
<text x="28" y="308" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">Kind B is the part a linter can never do — code that runs perfectly and is still the wrong thing.</text>
