<text x="28" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="19" font-weight="650" fill="#e8edf5">Two questions. Only survivors reach you.</text>
