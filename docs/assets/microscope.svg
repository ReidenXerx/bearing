<rect x="620" y="140" width="544" height="200" rx="10" fill="#111A1F" stroke="#E0A458" stroke-width="1.5"/>
<text x="644" y="168" class="lab" text-anchor="start" style="fill:#E0A458">EVERY FINDING MUST SURVIVE A REFUTATION PASS</text>
<text x="644" y="204" class="t" text-anchor="start">"this fee is computed on gross, should be net"</text>
<text x="644" y="230" class="d" text-anchor="start">Kind B — the question a linter cannot ask:</text>
<text x="644" y="252" class="d" text-anchor="start">why does this exist? is this the wrong abstraction?</text>
<line x1="644" y1="274" x2="1140" y2="274" stroke="#21303A" stroke-width="1.2"/>
<text x="644" y="300" class="mono" text-anchor="start" style="fill:#4FC2AE">survives  →  reaches you</text>
<text x="644" y="322" class="mono" text-anchor="start" style="fill:#8DA0A7">refuted   →  never printed</text>
<text x="36" y="362" class="d" text-anchor="start">Code that runs perfectly and is still wrong is the target — the persona is resolved from your repo at install and pinned, so wave 2 is not a different expert than wave 1.</text>
