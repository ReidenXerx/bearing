<svg height="342" viewBox="0 0 900 342" width="900" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><marker id="a" markerHeight="5.5" markerWidth="5.5" orient="auto-start-reverse" refX="8.5" refY="5" viewBox="0 0 10 10"><path d="m0 0 10 5-10 5z" fill="#3a465c"/></marker><radialGradient id="b" cx="100%" cy="0%" r="120%"><stop offset="0" stop-color="#161c27"/><stop offset=".55" stop-color="#11161f"/></radialGradient><linearGradient id="c" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1d2533"/><stop offset="1" stop-color="#1a2130"/></linearGradient><filter id="d" height="140%" width="140%" x="-20%" y="-20%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dx="0" dy="6" result="off"/><feComponentTransfer><feFuncA slope="0.55" type="linear"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><rect fill="url(#b)" height="342" rx="14" stroke="#232c3b" width="900"/><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" x="28" y="34">MILESTONE REVIEW · ONE AGENT PER SLICE</text><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" x="28" y="60">A panel of specialists, not a checklist.</text><rect fill="url(#c)" filter="url(#d)" height="58" rx="10" stroke="#2c3648" width="196" x="28" y="112"/><path d="m29 123a10 10 0 0 1 10-10h2v56h-2a10 10 0 0 1 -10-10z" fill="#61708a"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="48" y="137">Your change</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="48" y="156">mapped into slices</text><rect fill="url(#c)" filter="url(#d)" height="58" rx="10" stroke="#2c3648" width="196" x="28" y="186"/><path d="m29 197a10 10 0 0 1 10-10h2v56h-2a10 10 0 0 1 -10-10z" fill="#3987e5"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="48" y="211">Pinned persona</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="48" y="230">staff ledger engineer</text><g fill="url(#c)" stroke="#2c3648"><rect height="52" opacity=".4" rx="10" width="268" x="282" y="100"/><rect height="52" opacity=".7" rx="10" width="268" x="277" y="104"/><rect filter="url(#d)" height="52" rx="10" width="268" x="272" y="108"/></g><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="288" y="130">KIND A — is it right?</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="288" y="149">logic · edges · races</text><rect fill="url(#c)" height="52" opacity=".4" rx="10" stroke="#2c3648" width="268" x="282" y="188"/><rect fill="url(#c)" height="52" opacity=".7" rx="10" stroke="#2c3648" width="268" x="277" y="192"/><rect fill="url(#c)" filter="url(#d)" height="52" rx="10" stroke="#2c3648" width="268" x="272" y="196"/><path d="m273 207a10 10 0 0 1 10-10h2v50h-2a10 10 0 0 1 -10-10z" fill="#3987e5"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="292" y="218">KIND B — the RIGHT thing?</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="292" y="237">necessity · proportionality</text><path d="m224 141h24v-7h24" fill="none" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><path d="m224 215h24v7h24" fill="none" marker-end="url(#a)" stroke="#3987e5" stroke-width="1.75"/><path d="m224 141h24v81h24" fill="none" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><text fill="#61708a" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="272" y="178">spawned in parallel where the runtime allows</text><path d="m540 134h26v38h26" fill="none" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><path d="m540 222h26v-50h26" fill="none" marker-end="url(#a)" stroke="#3987e5" stroke-width="1.75"/><rect fill="url(#c)" filter="url(#d)" height="60" rx="10" stroke="#2c3648" width="280" x="592" y="142"/><path d="m593 153a10 10 0 0 1 10-10h2v58h-2a10 10 0 0 1 -10-10z" fill="#d95926"/><text fill="#e8edf5" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="15" font-weight="600" x="612" y="168">Try to REFUTE it</text><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="612" y="187">trace the value, read the branch</text><path d="m732 202v52h-332v6" fill="none" marker-end="url(#a)" stroke="#199e70" stroke-width="1.75"/><path d="m732 202v58" marker-end="url(#a)" stroke="#3a465c" stroke-width="1.75"/><g filter="url(#d)"><rect fill="#199e70" height="26" rx="13" width="286.8" x="264" y="266"/><text fill="#fff" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" x="407.4" y="283.5">✓ survives → reported with file:line</text></g><g filter="url(#d)"><rect fill="#d95926" height="26" rx="13" width="227.6" x="628" y="266"/><text fill="#fff" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" text-anchor="middle" x="741.8" y="283.5">✕ refuted → you never see it</text></g><text fill="#9aa8bd" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" x="28" y="324">Kind B is the part a linter can never do — code that runs perfectly and is still the wrong thing.</text></svg>