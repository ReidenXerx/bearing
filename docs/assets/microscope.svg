<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Kind A asks 'is it right?' — a linter can ask that. Kind B asks 'is it the right thing?' and catches a fee computed on gross that should be net: code that runs perfectly and is still wrong. Every finding must survive an adversarial refutation pass before it reaches you.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
  <radialGradient id="surfaceGrad" cx="100%" cy="0%" r="120%">
    <stop offset="0%" stop-color="#161c27"/>
    <stop offset="55%" stop-color="#11161f"/>
  </radialGradient>
  <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1d2533"/>
    <stop offset="100%" stop-color="#1a2130"/>
  </linearGradient>
</defs>
<rect width="900" height="300" rx="14" fill="url(#surfaceGrad)" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">DOMAIN-EXPERT REVIEW · EVERY FINDING MUST SURVIVE REFUTATION</text>
<text x="28" y="62" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="21" font-weight="700" fill="#e8edf5">It runs perfectly. It's still the wrong fee.</text>
<rect x="28" y="87" width="520" height="56" rx="10" fill="#000" opacity="0.3"/>
<rect x="28" y="92" width="520" height="56" rx="10" fill="#1a2130" stroke="#2c3648"/>
<text x="48" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" font-weight="500"><tspan fill="#61708a">const </tspan><tspan fill="#e8edf5">fee</tspan><tspan fill="#61708a"> = </tspan><tspan fill="#f2a58a">gross</tspan><tspan fill="#e8edf5"> * RATE;</tspan></text>
<text x="560" y="120" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#d95926">← the bug lives here</text>
<text x="560" y="138" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#9aa8bd">fee on gross, should be net</text>
<rect x="28" y="171" width="267.6" height="26" rx="13" fill="#000" opacity="0.3"/>
<rect x="28" y="168" width="267.6" height="26" rx="13" fill="#199e70"/>
<text x="161.8" y="185.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✓  passes tests · linter  (Kind A)</text>
<rect x="28" y="209" width="334.2" height="26" rx="13" fill="#000" opacity="0.3"/>
<rect x="28" y="206" width="334.2" height="26" rx="13" fill="#d95926"/>
<text x="195.1" y="223.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✗  fee on gross — ledger engineer  (Kind B)</text>
<rect x="28" y="246" width="280" height="34" rx="8" fill="none" stroke="#199e70" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="168" y="268" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#199e70">REFUTE → SURVIVED → reported</text>
<text x="330" y="268" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="13" fill="#9aa8bd">Kind B is the part a linter can never do.</text>
</svg>
