<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 326" width="900" height="326" role="img" aria-label="A change is reviewed by a pinned domain persona through correctness and judgment lenses; every finding must survive an adversarial refutation attempt before it is reported.">
