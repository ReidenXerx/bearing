<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 342" width="900" height="342" role="img" aria-label="A change is split into slices and one lens agent is spawned per slice, all carrying the same pinned domain persona, asking correctness and judgment questions in parallel; every finding must then survive an adversarial refutation attempt before it reaches you.">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#3a465c"/>
  </marker>
</defs>
<rect width="900" height="342" rx="14" fill="#11161f" stroke="#232c3b"/>
<text x="28" y="34" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6" fill="#61708a">MILESTONE REVIEW · ONE AGENT PER SLICE</text>
<text x="28" y="60" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="19" font-weight="650" fill="#e8edf5">A panel of specialists, not a checklist.</text>
<rect x="28" y="112" width="196" height="58" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M29 123 a10 10 0 0 1 10 -10 h2 v56 h-2 a10 10 0 0 1 -10 -10 z" fill="#61708a"/>
<text x="48" y="137" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Your change</text>
<text x="48" y="156" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">mapped into slices</text>
<rect x="28" y="186" width="196" height="58" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M29 197 a10 10 0 0 1 10 -10 h2 v56 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="48" y="211" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Pinned persona</text>
<text x="48" y="230" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">staff ledger engineer</text>
<rect x="282" y="100" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.4"/>
<rect x="277" y="104" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.7"/>
<rect x="272" y="108" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648"/>
<text x="288" y="130" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#9aa8bd">KIND A — is it right?</text>
<text x="288" y="149" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">logic · edges · races</text>
<rect x="282" y="188" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.4"/>
<rect x="277" y="192" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648" opacity="0.7"/>
<rect x="272" y="196" width="268" height="52" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M273 207 a10 10 0 0 1 10 -10 h2 v50 h-2 a10 10 0 0 1 -10 -10 z" fill="#3987e5"/>
<text x="292" y="218" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">KIND B — the RIGHT thing?</text>
<text x="292" y="237" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">necessity · proportionality</text>
<path d="M224 141 H248 V134 H272" fill="none" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<path d="M224 215 H248 V222 H272" fill="none" stroke="#3987e5" stroke-width="1.75" marker-end="url(#ar)"/>
<path d="M224 141 H248 V222 H272" fill="none" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<text x="272" y="178" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#61708a">spawned in parallel where the runtime allows</text>
<path d="M540 134 H566 V172 H592" fill="none" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<path d="M540 222 H566 V172 H592" fill="none" stroke="#3987e5" stroke-width="1.75" marker-end="url(#ar)"/>
<rect x="592" y="142" width="280" height="60" rx="10" fill="#1a2130" stroke="#2c3648"/>
<path d="M593 153 a10 10 0 0 1 10 -10 h2 v58 h-2 a10 10 0 0 1 -10 -10 z" fill="#d95926"/>
<text x="612" y="168" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="14.5" font-weight="600" fill="#e8edf5">Try to REFUTE it</text>
<text x="612" y="187" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">trace the value, read the branch</text>
<path d="M732 202 V254 H400 V260" fill="none" stroke="#199e70" stroke-width="1.75" marker-end="url(#ar)"/>
<line x1="732" y1="202" x2="732" y2="260" stroke="#3a465c" stroke-width="1.75" marker-end="url(#ar)"/>
<g><rect x="264" y="266" width="286.8" height="26" rx="13" fill="#199e70"/><text x="407.4" y="283.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✓  survives → reported with file:line</text></g>
<g><rect x="628" y="266" width="227.60000000000002" height="26" rx="13" fill="#d95926"/><text x="741.8" y="283.5" text-anchor="middle" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">✕  refuted → you never see it</text></g>
<text x="28" y="324" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="12.5" fill="#9aa8bd">Kind B is the part a linter can never do — code that runs perfectly and is still the wrong thing.</text>
</svg>
