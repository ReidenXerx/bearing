  <rect width="1200" height="330" rx="14" fill="#0A1013"/>
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="13.5" fill="none" stroke="#21303A" stroke-width="1.5"/>
<text x="36" y="44" class="lab" text-anchor="start">IT TELLS YOU WHEN IT'S THE PROBLEM</text>
<text x="36" y="76" class="h" text-anchor="start">The agent files bug reports against its own tooling</text>
<rect x="36" y="116" width="268" height="96" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="60" y="168" class="h" text-anchor="start" style="font-size:40px;fill:#E0A458">93</text>
<text x="60" y="194" class="d" text-anchor="start">reports filed</text>
<rect x="318" y="116" width="268" height="96" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="342" y="168" class="h" text-anchor="start" style="font-size:40px;fill:#E0A458">47</text>
<text x="342" y="194" class="d" text-anchor="start">commits they span</text>
<rect x="600" y="116" width="268" height="96" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="624" y="168" class="h" text-anchor="start" style="font-size:40px;fill:#E0A458">3</text>
<text x="624" y="194" class="d" text-anchor="start">weeks, one project</text>
<rect x="882" y="116" width="268" height="96" rx="10" fill="#111A1F" stroke="#21303A" stroke-width="1.5"/>
<text x="906" y="168" class="h" text-anchor="start" style="font-size:40px;fill:#E0A458">30</text>
