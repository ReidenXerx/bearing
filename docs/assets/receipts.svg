<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="93 bug reports against its own tooling across 47 commits in three weeks, 30 of them empty results for things that demonstrably existed, and a scorecard that reports whether enforcement is earning its keep.">
