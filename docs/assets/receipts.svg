<text x="60" y="256" class="monod" text-anchor="start">$ npm run bearing:scorecard</text>
<text x="60" y="284" class="mono" text-anchor="start" style="fill:#E8877A">⚠ Enforcement is 49% of graph interaction: 57 redirects vs 60 graph calls.</text>
