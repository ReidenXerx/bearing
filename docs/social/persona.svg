<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="A healthcare claims platform was reviewed by a developer-tooling engineer because inference read the tool's own boilerplate as evidence; it is now reviewed by a clinical systems engineer with HIPAA and patient-safety expertise. The agent was confident, it was wrong, and nothing would have told you.">
<defs><marker id="a" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L10 6 L1 11 z" fill="#3a465c"/></marker></defs>
<rect width="1200" height="1200" fill="#11161f"/>
<rect x="28" y="28" width="1144" height="1144" rx="28" fill="none" stroke="#232c3b" stroke-width="2"/>
<text x="100" y="150" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#61708a">A HEALTHCARE CLAIMS PLATFORM</text>
<text x="100" y="214" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="58" font-weight="700" letter-spacing="0" fill="#e8edf5">Who is reviewing your code?</text>
<text x="100" y="316" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#d95926">WAS REVIEWED BY</text>
<rect x="100" y="340" width="1000" height="160" rx="20" fill="#1a2130" stroke="#2c3648" stroke-width="2"/><path d="M102 362 a20 20 0 0 1 20 -20 h4 v156 h-4 a20 20 0 0 1 -20 -20 z" fill="#d95926"/>
<text x="148" y="412" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="52" font-weight="700" letter-spacing="0" fill="#e8edf5">a developer-tooling engineer</text>
<text x="148" y="460" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="26" font-weight="400" letter-spacing="0" fill="#9aa8bd">inference read the tool's own boilerplate as evidence</text>
<path d="M600 530 V596" stroke="#3a465c" stroke-width="4" marker-end="url(#a)"/>
<text x="100" y="686" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#3987e5">NOW REVIEWED BY</text>
<rect x="100" y="710" width="1000" height="172" rx="20" fill="#1a2130" stroke="#2c3648" stroke-width="2"/><path d="M102 732 a20 20 0 0 1 20 -20 h4 v168 h-4 a20 20 0 0 1 -20 -20 z" fill="#3987e5"/>
<text x="148" y="782" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="52" font-weight="700" letter-spacing="0" fill="#e8edf5">a clinical systems engineer</text>
<text x="148" y="836" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="36" font-weight="600" letter-spacing="0" fill="#199e70">with HIPAA and patient-safety expertise</text>
<text x="100" y="1010" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="40" font-weight="600" letter-spacing="0" fill="#e8edf5">The agent was confident. It was wrong.</text>
<text x="100" y="1060" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="40" font-weight="600" letter-spacing="0" fill="#9aa8bd">Nothing would have told you.</text>
<text x="100" y="1140" text-anchor="start" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',sans-serif" font-size="40" font-weight="800" letter-spacing="0" fill="#3987e5">bearing</text>
<text x="1100" y="1140" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="30" font-weight="400" letter-spacing="0" fill="#61708a">npx bearing</text>
</svg>